[package]
name = "psign-portable-ffi"
version = "0.5.0"
edition = "2024"
description = "C ABI shared library for psign portable Authenticode operations"
license.workspace = true
repository.workspace = true

[lib]
name = "psign_core"
crate-type = ["cdylib", "rlib"]

[features]
default = []
azure-kv-sign = ["psign-portable-core/azure-kv-sign"]
artifact-signing-rest = ["psign-portable-core/artifact-signing-rest"]

[dependencies]
anyhow = "1"
psign-portable-core = { path = "../psign-portable-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

