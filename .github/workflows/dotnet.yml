name: dotnet

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2.9.1

      - name: Build Rust psign-tool (differential test oracle)
        run: cargo build -p psign --bin psign-tool --locked

      - name: Restore
        run: dotnet restore dotnet/Devolutions.Psign.slnx

      - name: Build
        run: dotnet build dotnet/Devolutions.Psign.slnx -c Release --no-restore

      - name: Test (with Rust differential tests)
        run: dotnet test dotnet/src/Devolutions.Psign.Tests/Devolutions.Psign.Tests.csproj -c Release --no-build

  pack:
    name: Pack NuGet packages
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Pack
        run: |
          dotnet pack dotnet/src/Devolutions.Psign.Core/Devolutions.Psign.Core.csproj -c Release -o dotnet/artifacts
          dotnet pack dotnet/src/Devolutions.Psign.Verification/Devolutions.Psign.Verification.csproj -c Release -o dotnet/artifacts
          dotnet pack dotnet/src/Devolutions.Psign.Signing/Devolutions.Psign.Signing.csproj -c Release -o dotnet/artifacts
          dotnet pack dotnet/src/Devolutions.Psign.Cli/Devolutions.Psign.Cli.csproj -c Release -o dotnet/artifacts

      - name: Smoke-test managed dotnet tool
        run: |
          dotnet tool install --tool-path ./dotnet/tool-smoke --add-source ./dotnet/artifacts Devolutions.Psign.Cli
          ./dotnet/tool-smoke/psign-tool portable pe-digest tests/fixtures/pe-authenticode-upstream/tiny64.signed.efi

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: psign-dotnet-nupkgs
          path: dotnet/artifacts/*.nupkg
