name: dotnet

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2.9.1

      - name: Build Rust psign-tool, psign-server, psign-depgraph and portable FFI (differential test oracles)
        run: |
          cargo build -p psign --bin psign-tool --locked
          cargo build -p psign --features timestamp-server --bin psign-server --locked
          cargo build -p psign --bin psign-depgraph --locked
          cargo build -p psign-portable-ffi --features "azure-kv-sign artifact-signing-rest" --locked

      - name: Restore
        run: dotnet restore dotnet/Devolutions.Psign.slnx

      - name: Build
        run: dotnet build dotnet/Devolutions.Psign.slnx -c Release --no-restore

      - name: Test (with Rust differential tests)
        run: dotnet test dotnet/src/Devolutions.Psign.Tests/Devolutions.Psign.Tests.csproj -c Release --no-build

      - name: Publish NativeAOT psign-tool, psign-server and psign-depgraph
        shell: bash
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) rid=linux-x64 ;;
            Linux-ARM64) rid=linux-arm64 ;;
            Windows-X64) rid=win-x64 ;;
            Windows-ARM64) rid=win-arm64 ;;
            macOS-X64) rid=osx-x64 ;;
            macOS-ARM64) rid=osx-arm64 ;;
            *) echo "unsupported runner $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          aot="$RUNNER_TEMP/psign-aot"
          # Trim / AOT warnings fail the publish so new reflection or dynamic-code use is caught here.
          for project in Cli Server DepGraph; do
            dotnet publish "dotnet/src/Devolutions.Psign.$project/Devolutions.Psign.$project.csproj" -c Release -r "$rid" \
              -p:PublishAot=true -p:TreatWarningsAsErrors=true -o "$aot/$project"
          done
          {
            echo "PSIGN_MANAGED_TOOL=$aot/Cli/psign-tool$ext"
            echo "PSIGN_MANAGED_SERVER=$aot/Server/psign-server$ext"
            echo "PSIGN_MANAGED_DEPGRAPH=$aot/DepGraph/psign-depgraph$ext"
          } >> "$GITHUB_ENV"

      - name: Test NativeAOT binaries (same differential suite, managed tools run out of process)
        run: dotnet test dotnet/src/Devolutions.Psign.Tests/Devolutions.Psign.Tests.csproj -c Release --no-build

  pack:
    name: Pack NuGet packages
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Pack
        shell: pwsh
        run: ./nuget/pack-managed-packages.ps1 -OutputDir dotnet/artifacts

      - name: Smoke-test managed packages
        shell: pwsh
        run: ./nuget/scripts/Test-PsignManagedPackages.ps1 -PackageDir dotnet/artifacts

      - name: Test release NuGet publishing
        shell: pwsh
        run: ./nuget/scripts/Test-PsignNuGetPublish.ps1

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: psign-dotnet-nupkgs
          path: dotnet/artifacts/*.nupkg
          if-no-files-found: error
